openapi: "3.1.0"

info:
  title: PiCal API
  version: "1.0.0"
  description: Calendar event management API for PiCal

servers:
  - url: /
    description: Local server

tags:
  - name: Events
    description: Calendar event CRUD operations
  - name: Occurrences
    description: Event occurrence management
  - name: Health
    description: Server health

paths:
  /health:
    get:
      summary: Health check
      operationId: health
      tags: [Health]
      responses:
        "200":
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /events:
    $ref: "./events.yaml#/paths/~1events"

  /events/{id}:
    $ref: "./events.yaml#/paths/~1events~1{id}"

  /occurrences:
    $ref: "./occurrences.yaml#/paths/~1occurrences"

  /occurrences/{id}:
    $ref: "./occurrences.yaml#/paths/~1occurrences~1{id}"
